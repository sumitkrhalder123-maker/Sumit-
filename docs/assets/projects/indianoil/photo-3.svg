<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="mistSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="billboardAstral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Sky & Mountains -->
  <rect width="1200" height="800" fill="url(#mistSky)"/>
  <path d="M0,220 Q400,160 800,200 T1200,180 L1200,800 L0,800 Z" fill="#334155" opacity="0.5"/>

  <!-- Station Overhead Canopy Roof -->
  <polygon points="0,0 850,0 600,220 0,260" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>

  <!-- Curved Railway Platform Concourse -->
  <path d="M0,280 Q350,300 700,340 T1200,420 L1200,800 L0,800 Z" fill="#94a3b8"/>
  <path d="M0,320 Q350,340 700,380 T1200,460 L1200,800 L0,800 Z" fill="#e2e8f0"/>
  <!-- Safety tactile edge line -->
  <path d="M0,380 Q350,400 700,440 T1200,520 L1200,535 T700,455 Q350,415 0,395 Z" fill="#b91c1c"/>

  <!-- Rails on left curve -->
  <path d="M0,450 Q300,460 600,490 T1200,560" stroke="#475569" stroke-width="6" fill="none"/>
  <path d="M0,470 Q300,480 600,510 T1200,580" stroke="#64748b" stroke-width="6" fill="none"/>

  <!-- Approaching Blue Locomotive on Curve -->
  <g transform="translate(680, 290)">
    <rect x="0" y="20" width="130" height="85" rx="5" fill="#1e40af" stroke="#0f172a" stroke-width="2"/>
    <rect x="15" y="30" width="35" height="35" rx="3" fill="#93c5fd"/>
    <ellipse cx="25" cy="25" rx="10" ry="8" fill="#fef08a"/>
    <circle cx="25" cy="25" r="5" fill="#ffffff"/>
    <!-- Buffer -->
    <rect x="0" y="85" width="130" height="15" fill="#b91c1c"/>
  </g>

  <!-- Large Overhead Billboard: ASTRAL PIPES 25 YEARS -->
  <g transform="translate(520, 40)">
    <rect x="0" y="0" width="480" height="130" rx="8" fill="url(#billboardAstral)" stroke="#1d4ed8" stroke-width="4"/>
    <rect x="15" y="15" width="120" height="40" fill="#dc2626" rx="4"/>
    <text x="25" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">ASTRAL</text>
    <text x="145" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#fbbf24">PIPES</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">INDIA KA BHAROSEMAND PIPE</text>
    <text x="25" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">Celebrating 25 Years of Trust & Innovation</text>
  </g>

  <!-- Station Crowd & Passengers -->
  <g fill="#1e293b" opacity="0.85">
    <!-- Person 1 -->
    <circle cx="210" cy="330" r="10"/>
    <path d="M200,342 L220,342 L224,400 L196,400 Z"/>
    <!-- Person 2 -->
    <circle cx="240" cy="325" r="10"/>
    <path d="M230,337 L250,337 L253,395 L227,395 Z" fill="#b91c1c"/>
    <!-- Person 3 (Tourist with camera) -->
    <circle cx="280" cy="332" r="9"/>
    <path d="M272,343 L288,343 L292,398 L268,398 Z" fill="#047857"/>
    <!-- Person 4 -->
    <circle cx="340" cy="338" r="10"/>
    <path d="M330,350 L350,350 L354,410 L326,410 Z" fill="#0369a1"/>
    <!-- Group near pillar -->
    <circle cx="430" cy="350" r="9"/>
    <path d="M422,361 L438,361 L441,415 L419,415 Z"/>
    <circle cx="450" cy="355" r="8"/>
    <path d="M443,365 L457,365 L460,415 L440,415 Z" fill="#c2410c"/>
  </g>

  <!-- Station Pillar with Indane & Servo Posters -->
  <g transform="translate(120, 220)">
    <rect x="0" y="0" width="80" height="360" rx="4" fill="#15803d"/>
    <!-- Indane Wrap -->
    <rect x="4" y="20" width="72" height="150" rx="3" fill="#0284c7"/>
    <text x="12" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">Indane</text>
    <text x="12" y="58" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#fef08a">Composite LPG</text>
    <rect x="18" y="70" width="44" height="60" rx="8" fill="#ef4444"/>
    <!-- Servo Wrap -->
    <rect x="4" y="180" width="72" height="150" rx="3" fill="#18181b"/>
    <text x="10" y="202" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ea580c">SERVO 4T</text>
    <text x="10" y="215" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#ffffff">XTRA CAN'T DO WITHOUT IT</text>
  </g>

  <!-- Photo Title Stamp Overlay -->
  <g transform="translate(40, 710)">
    <rect x="0" y="0" width="500" height="54" rx="10" fill="#0b0f17" opacity="0.9" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">DARJEELING STATION CONCOURSE & OUTDOOR HOARDINGS</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">High-Footfall Railway Platform Crowd, Billboards & Brand Pillar Wraps</text>
  </g>
</svg>
