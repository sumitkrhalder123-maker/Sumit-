<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#93c5fd"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="steamBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <!-- Sky & Mountains Sunset -->
  <rect width="1200" height="800" fill="url(#sunsetSky)"/>

  <!-- Distant Hillside Terraces & Towns -->
  <path d="M0,320 Q300,280 600,310 T1200,290 L1200,800 L0,800 Z" fill="#334155" opacity="0.6"/>
  <!-- Tiny mountain dwellings on hills -->
  <g fill="#fde047" opacity="0.75">
    <circle cx="150" cy="320" r="2"/>
    <circle cx="210" cy="330" r="2"/>
    <circle cx="340" cy="315" r="2.5"/>
    <circle cx="480" cy="325" r="2"/>
    <circle cx="560" cy="310" r="2"/>
  </g>

  <!-- Track Bed & Ballast Ground -->
  <polygon points="0,420 1200,380 1200,800 0,800" fill="#475569"/>

  <!-- Multiple Narrow Gauge Railway Tracks Branching -->
  <path d="M100,800 L500,420" stroke="#94a3b8" stroke-width="6"/>
  <path d="M150,800 L530,420" stroke="#cbd5e1" stroke-width="6"/>

  <path d="M650,800 L560,420" stroke="#94a3b8" stroke-width="6"/>
  <path d="M710,800 L590,420" stroke="#cbd5e1" stroke-width="6"/>

  <path d="M1050,800 L680,420" stroke="#94a3b8" stroke-width="6"/>
  <path d="M1120,800 L710,420" stroke="#cbd5e1" stroke-width="6"/>

  <!-- Left: Blue Diesel Engine heading toward Valley -->
  <g transform="translate(180, 420)">
    <rect x="0" y="30" width="180" height="110" rx="6" fill="#1e40af" stroke="#0f172a" stroke-width="3"/>
    <rect x="20" y="45" width="45" height="40" rx="3" fill="#93c5fd"/>
    <rect x="80" y="45" width="45" height="40" rx="3" fill="#93c5fd"/>
    <!-- Yellow stripe & Indian Railways branding -->
    <rect x="0" y="95" width="180" height="14" fill="#facc15"/>
    <text x="15" y="106" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#0f172a">INDIAN RAILWAYS DHR</text>
    <circle cx="40" cy="150" r="18" fill="#111827"/>
    <circle cx="100" cy="150" r="18" fill="#111827"/>
    <circle cx="150" cy="150" r="18" fill="#111827"/>
  </g>

  <!-- Right: Iconic Historic DHR B-Class Steam Locomotive #788 -->
  <g transform="translate(680, 310)">
    <!-- Steam Boiler & Cab -->
    <rect x="180" y="50" width="160" height="170" rx="6" fill="url(#steamBlack)" stroke="#09090b" stroke-width="3"/>
    <!-- Cab Window with Engine Driver silhouette -->
    <rect x="200" y="70" width="60" height="65" rx="4" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
    <circle cx="230" cy="100" r="14" fill="#111827"/>

    <!-- Cylindrical Boiler -->
    <rect x="30" y="80" width="160" height="130" rx="8" fill="url(#steamBlack)" stroke="#09090b" stroke-width="3"/>

    <!-- Tall Brass Steam Dome & Smokestack -->
    <rect x="60" y="20" width="30" height="65" rx="3" fill="#0f172a"/>
    <ellipse cx="75" cy="20" rx="18" ry="7" fill="#ca8a04" stroke="#eab308" stroke-width="2"/>

    <!-- Brass Steam Dome -->
    <ellipse cx="145" cy="75" rx="20" ry="16" fill="#eab308" stroke="#ca8a04" stroke-width="3"/>

    <!-- Brass Nameplate: DARJEELING HIMALAYAN RAILWAY 788 B-CLASS -->
    <rect x="50" y="125" width="120" height="26" rx="3" fill="#ca8a04" stroke="#713f12" stroke-width="2"/>
    <text x="56" y="142" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#0f172a">DHR 788 B-CLASS</text>

    <!-- Side Water Tanks with Indian Oil / Railways crest -->
    <rect x="40" y="160" width="140" height="45" fill="#111827" stroke="#475569" stroke-width="1.5"/>

    <!-- Red Cowcatcher & Buffer -->
    <polygon points="10,210 30,200 30,230 10,230" fill="#dc2626"/>
    <circle cx="20" cy="215" r="8" fill="#fef08a"/>

    <!-- Large Spoked Wheels & Coupling Rods -->
    <g fill="#1e293b" stroke="#ca8a04" stroke-width="4">
      <circle cx="90" cy="235" r="28"/>
      <circle cx="160" cy="235" r="28"/>
      <circle cx="230" cy="235" r="28"/>
    </g>
    <!-- Connecting Rod -->
    <line x1="90" y1="235" x2="230" y2="235" stroke="#94a3b8" stroke-width="6"/>

    <!-- Gentle puff of steam -->
    <ellipse cx="75" cy="5" rx="35" ry="18" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="60" cy="-15" rx="50" ry="24" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Photo Title Stamp Overlay -->
  <g transform="translate(40, 710)">
    <rect x="0" y="0" width="510" height="54" rx="10" fill="#0b0f17" opacity="0.9" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">HISTORIC DHR STEAM & DIESEL RAILWAY JUNCTION</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">Darjeeling Station Branching Tracks • Vintage B-Class 788 & Diesel Engine</text>
  </g>
</svg>
