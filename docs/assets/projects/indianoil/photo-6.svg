<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="hallFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hallRoof" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Gallery Interior Perspective Background -->
  <rect width="1200" height="800" fill="#e2e8f0"/>

  <!-- Station Covered Roof Ceiling with Vanishing Point -->
  <polygon points="0,0 1200,0 800,320 400,320" fill="url(#hallRoof)"/>
  <!-- Ceiling structural beams -->
  <line x1="200" y1="0" x2="480" y2="320" stroke="#64748b" stroke-width="3"/>
  <line x1="600" y1="0" x2="600" y2="320" stroke="#64748b" stroke-width="3"/>
  <line x1="1000" y1="0" x2="720" y2="320" stroke="#64748b" stroke-width="3"/>

  <!-- Platform Corridor Floor with Vanishing Perspective -->
  <polygon points="0,800 1200,800 800,320 400,320" fill="url(#hallFloor)"/>
  <!-- Floor Tile Perspective Lines -->
  <line x1="200" y1="800" x2="480" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="800" x2="540" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="800" x2="600" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="800" x2="660" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="1000" y1="800" x2="720" y2="320" stroke="#94a3b8" stroke-width="2"/>

  <!-- Left Wall & Windows overlooking Track -->
  <polygon points="0,0 400,320 400,800 0,800" fill="#cbd5e1"/>
  <rect x="50" y="240" width="80" height="280" rx="4" fill="#93c5fd" opacity="0.6"/>
  <rect x="180" y="270" width="70" height="220" rx="4" fill="#93c5fd" opacity="0.6"/>

  <!-- Repetitive Structural Pillars with Alternating IndianOil Branding -->

  <!-- Pillar 4 (Far Distance) -->
  <g transform="translate(680, 290)">
    <rect x="0" y="0" width="30" height="150" fill="#15803d"/>
    <rect x="2" y="10" width="26" height="70" fill="#0284c7"/>
  </g>

  <!-- Pillar 3 (Mid-distance) -->
  <g transform="translate(730, 270)">
    <rect x="0" y="0" width="45" height="200" fill="#15803d"/>
    <rect x="2" y="15" width="41" height="100" fill="#18181b"/>
    <text x="5" y="35" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#ea580c">SERVO</text>
  </g>

  <!-- Pillar 2 (Mid-foreground): SERVO 4T XTRA -->
  <g transform="translate(800, 230)">
    <rect x="0" y="0" width="80" height="300" rx="4" fill="#15803d"/>
    <!-- Black Servo Wrap -->
    <rect x="3" y="15" width="74" height="170" rx="3" fill="#18181b" stroke="#ea580c" stroke-width="2"/>
    <rect x="8" y="22" width="64" height="22" fill="#ea580c" rx="2"/>
    <text x="14" y="37" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff">SERVO 4T</text>
    <text x="10" y="55" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#facc15">CAN'T DO WITHOUT IT!</text>
    <!-- Ambassador & Bottle Graphic -->
    <rect x="15" y="65" width="50" height="70" rx="3" fill="#27272a"/>
    <circle cx="40" cy="85" r="14" fill="#ca8a04"/>
    <text x="10" y="155" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#ffffff">The Ultimate Bike Oil</text>
    <text x="10" y="168" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#ea580c">IndianOil SERVO</text>
  </g>

  <!-- Pillar 1 (Foreground Prominent): INDANE COMPOSITE CYLINDER -->
  <g transform="translate(930, 160)">
    <rect x="0" y="0" width="160" height="480" rx="6" fill="#15803d"/>
    <!-- Blue Indane Wrap -->
    <rect x="4" y="20" width="152" height="320" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Indane Header -->
    <rect x="12" y="28" width="136" height="42" fill="#ffffff" rx="4"/>
    <circle cx="32" cy="49" r="12" fill="#ea580c"/>
    <text x="52" y="47" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0369a1">Indane</text>
    <text x="52" y="60" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#334155">IndianOil Corporation</text>

    <!-- Main Slogan -->
    <text x="16" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff">Perfect partner</text>
    <text x="16" y="106" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#f8fafc">for your modern kitchen</text>

    <!-- Bullets -->
    <g transform="translate(16, 120)" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">
      <circle cx="5" cy="5" r="4" fill="#ea580c"/>
      <text x="16" y="9">50% lighter than steel</text>
      
      <circle cx="5" cy="24" r="4" fill="#ea580c"/>
      <text x="16" y="28">Translucent body for fuel level</text>

      <circle cx="5" cy="43" r="4" fill="#ea580c"/>
      <text x="16" y="47">Rust-free &amp; Aesthetic look</text>

      <circle cx="5" cy="62" r="4" fill="#ea580c"/>
      <text x="16" y="66">Available in 5 KG &amp; 10 KG</text>
    </g>

    <!-- Product Render -->
    <rect x="50" y="205" width="60" height="90" rx="14" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <rect x="58" y="215" width="44" height="65" rx="8" fill="#f87171"/>
  </g>

  <!-- Station Benches along corridor -->
  <g transform="translate(560, 480)">
    <rect x="0" y="0" width="140" height="30" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <rect x="15" y="30" width="8" height="35" fill="#1e293b"/>
    <rect x="117" y="30" width="8" height="35" fill="#1e293b"/>
  </g>

  <!-- Photo Title Stamp Overlay -->
  <g transform="translate(40, 710)">
    <rect x="0" y="0" width="520" height="54" rx="10" fill="#0b0f17" opacity="0.9" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">STATION PASSENGER GALLERY PILLAR BRAND SEQUENCE</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">Vanishing Architectural Perspective • Alternating Indane &amp; Servo Campaign Wraps</text>
  </g>
</svg>
