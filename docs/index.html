<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumit Kumer Halder - Portfolio</title>
    <meta name="description" content="Professional portfolio of Sumit Kumer Halder — AI Generalist, Video Editor, AI Graphic Designer & Prompt Engineer." />
    <meta property="og:title" content="Sumit Kumer Halder - Portfolio" />
    <meta property="og:description" content="Professional portfolio of Sumit Kumer Halder — AI Generalist, Video Editor, AI Graphic Designer & Prompt Engineer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Automatic trailing slash normalizer for GitHub Pages relative asset resolution -->
    <script>
      (function() {
        try {
          var loc = window.location;
          if (loc.hostname && loc.hostname.endsWith('github.io') && !loc.pathname.endsWith('/') && !/\.[a-zA-Z0-9]+$/.test(loc.pathname)) {
            loc.replace(loc.pathname + '/' + loc.search + loc.hash);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <script type="module" crossorigin src="./assets/index.js"></script>
  </head>
  <body class="bg-[#070a11] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200" style="background-color: #070a11; color: #f1f5f9; min-height: 100vh; margin: 0;">
    <div id="root">
      <div id="gs-loading-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #070a11; color: #38bdf8; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; padding: 20px; box-sizing: border-box;">
        <div id="gs-spinner" style="width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: gs-spin 0.9s linear infinite;"></div>
        <p id="gs-loader-text" style="margin-top: 18px; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; color: #94a3b8; text-transform: uppercase;">Loading Graphics Sumit Portfolio...</p>
        <style>@keyframes gs-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <noscript>
      <div style="padding: 40px; text-align: center; color: white; font-family: sans-serif; background: #070a11; min-height: 100vh;">
        <h2>JavaScript Required</h2>
        <p style="color: #94a3b8; margin-top: 8px;">Please enable JavaScript in your browser to view the interactive 3D portfolio of Sumit Kumer Halder.</p>
      </div>
    </noscript>
    <!-- Fallback development entry for live TypeScript compilation in dev servers -->
    <script type="module">
      var isDev = window.location.hostname === 'localhost' || 
                  window.location.hostname === '127.0.0.1' || 
                  window.location.hostname.indexOf('ais-dev') !== -1 ||
                  window.location.port === '3000';
      if (isDev && !window.__GS_MOUNTED__) {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
