<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="50%" stop-color="#f5eedc" />
      <stop offset="100%" stop-color="#eedfc3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5a1818" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Diagonal warm background rays -->
  <path d="M-100 675 L400 -100 L550 -100 L50 675 Z" fill="#e8d5b5" opacity="0.4" />
  <path d="M200 675 L700 -100 L850 -100 L350 675 Z" fill="#e8d5b5" opacity="0.3" />

  <!-- Bikano Brand Crossword Grid -->
  <g transform="translate(180, 110)">
    <!-- Red Letter Box 1 -->
    <rect x="0" y="0" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />

    <!-- Red Letter Box 2 (E) -->
    <rect x="175" y="0" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />
    <text x="250" y="108" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="95" text-anchor="middle">E</text>

    <!-- Red Letter Box 3 (Blank/Crossword) -->
    <rect x="350" y="0" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />

    <!-- Red Letter Box 4 (A) -->
    <rect x="525" y="0" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />
    <text x="600" y="108" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="95" text-anchor="middle">A</text>

    <!-- Red Letter Box 5 -->
    <rect x="700" y="0" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />

    <!-- Lower Row Boxes -->
    <rect x="175" y="175" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />
    <rect x="525" y="175" width="150" height="150" rx="14" fill="#991b1b" filter="url(#shadow)" />
  </g>

  <!-- Crossword text subtle bottom -->
  <text x="220" y="520" fill="#3f2b1d" opacity="0.8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="72" letter-spacing="2">crossword</text>

  <!-- Cyan Interactive Play Button Accent In Center -->
  <g transform="translate(600, 310)">
    <circle r="52" fill="#06b6d4" filter="url(#shadow)" />
    <circle r="46" fill="#22d3ee" />
    <polygon points="-12,-20 -12,20 22,0" fill="#ffffff" />
  </g>

  <!-- Bikano Corner Badge -->
  <g transform="translate(60, 50)">
    <rect width="180" height="42" rx="10" fill="#7f1d1d" />
    <text x="90" y="27" fill="#fef08a" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="3">BIKANO</text>
  </g>
</svg>
