<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="hillSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="coachBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#hillSky)"/>

  <!-- Hillside Town Buildings, Shops & Pine Trees -->
  <g fill="#475569">
    <rect x="50" y="160" width="120" height="180" rx="3"/>
    <polygon points="40,160 110,110 180,160" fill="#334155"/>
    <rect x="200" y="190" width="160" height="150" rx="3" fill="#64748b"/>
    <polygon points="190,190 280,130 370,190" fill="#475569"/>
    <rect x="800" y="140" width="220" height="200" rx="3" fill="#334155"/>
    <polygon points="780,140 910,80 1040,140" fill="#1e293b"/>
  </g>

  <!-- Darjeeling Mountain Road & Curved Asphalt Street -->
  <polygon points="0,320 1200,300 1200,800 0,800" fill="#334155"/>
  <polygon points="0,480 1200,420 1200,800 0,800" fill="#1e293b"/>

  <!-- Street Narrow-Gauge Rails Curves right into the road -->
  <path d="M0,580 Q400,530 800,500 T1200,470" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <path d="M0,605 Q400,555 800,525 T1200,495" stroke="#cbd5e1" stroke-width="6" fill="none"/>

  <!-- Blue Narrow-Gauge Passenger Train Rounding Street Bend -->
  <g transform="translate(180, 290)">
    <!-- Coach 1 -->
    <rect x="0" y="30" width="380" height="190" rx="10" fill="url(#coachBlue)" stroke="#0f172a" stroke-width="4"/>
    <!-- Windows -->
    <rect x="25" y="55" width="55" height="60" rx="5" fill="#93c5fd"/>
    <rect x="95" y="55" width="55" height="60" rx="5" fill="#93c5fd"/>
    <rect x="165" y="55" width="55" height="60" rx="5" fill="#93c5fd"/>
    <rect x="235" y="55" width="55" height="60" rx="5" fill="#93c5fd"/>
    <rect x="305" y="55" width="55" height="60" rx="5" fill="#93c5fd"/>

    <!-- Large Transit Advertising Board: T3 SMART MEDIA SOLUTIONS / IndianOil Media -->
    <rect x="20" y="130" width="340" height="58" rx="6" fill="#f8fafc" stroke="#f59e0b" stroke-width="3"/>
    <rect x="26" y="136" width="8" height="46" fill="#ea580c"/>
    <text x="44" y="155" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a">T3 SMART MEDIA SOLUTIONS</text>
    <text x="44" y="174" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#d97706">FOR ADVERTISEMENTS CALL • 9073 320 3XX</text>

    <!-- Wheels -->
    <circle cx="70" cy="225" r="18" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="150" cy="225" r="18" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="270" cy="225" r="18" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="340" cy="225" r="18" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- Coach 2 trailing behind -->
  <g transform="translate(580, 310)">
    <rect x="0" y="30" width="340" height="180" rx="8" fill="#1e3a8a" stroke="#0f172a" stroke-width="3"/>
    <rect x="25" y="55" width="50" height="55" rx="4" fill="#93c5fd"/>
    <rect x="90" y="55" width="50" height="55" rx="4" fill="#93c5fd"/>
    <rect x="155" y="55" width="50" height="55" rx="4" fill="#93c5fd"/>
    <!-- Indian Oil Wrap snippet on coach 2 -->
    <rect x="20" y="125" width="300" height="52" rx="4" fill="#0369a1"/>
    <text x="35" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">INDIAN OIL • XTRAGREEN</text>
    <text x="35" y="167" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fef08a">Sustainable Mobility In The Hills</text>
  </g>

  <!-- Street Pedestrian (Right side in green check shirt walking along track) -->
  <g transform="translate(980, 410)">
    <!-- Head -->
    <circle cx="35" cy="30" r="14" fill="#1e293b"/>
    <!-- Green Checkered Shirt Torso -->
    <rect x="15" y="46" width="40" height="65" rx="4" fill="#15803d"/>
    <line x1="25" y1="46" x2="25" y2="111" stroke="#166534" stroke-width="2"/>
    <line x1="35" y1="46" x2="35" y2="111" stroke="#166534" stroke-width="2"/>
    <line x1="45" y1="46" x2="45" y2="111" stroke="#166534" stroke-width="2"/>
    <!-- Trousers -->
    <rect x="20" y="110" width="14" height="75" fill="#334155"/>
    <rect x="36" y="110" width="14" height="75" fill="#334155"/>
  </g>

  <!-- Hill Road Mountain Vehicle (White SUV / Car) in background -->
  <g transform="translate(1040, 360)">
    <rect x="0" y="15" width="110" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="15" y="20" width="35" height="20" rx="3" fill="#94a3b8"/>
    <rect x="55" y="20" width="40" height="20" rx="3" fill="#94a3b8"/>
    <circle cx="25" cy="62" r="10" fill="#1e293b"/>
    <circle cx="85" cy="62" r="10" fill="#1e293b"/>
  </g>

  <!-- Photo Title Stamp Overlay -->
  <g transform="translate(40, 710)">
    <rect x="0" y="0" width="530" height="54" rx="10" fill="#0b0f17" opacity="0.9" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">DHR MOUNTAIN STREET TRACK ROUNDING &amp; TRAIN WRAP</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">Live Street Intersection Dynamic Angle • Transit Ad Media Documentation</text>
  </g>
</svg>
